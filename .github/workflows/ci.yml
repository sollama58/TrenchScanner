name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, build and the migration checks. The tests run beside this, in their own jobs
  # below: one after another in a single job they took over five minutes of an eight-to-ten-minute
  # run (2026-10-18), most of it model-training tests in packages/core.
  checks:
    runs-on: ubuntu-latest
    # Without a limit a hung step - a migration waiting on a lock - holds the runner for GitHub's
    # default of six hours.
    timeout-minutes: 30

    # A real Postgres, not a mock - prisma:deploy actually applies every migration against it,
    # which catches migration-file drift/corruption that a schema-only check would miss. It is
    # PostgreSQL 18, production's major, from the PostgreSQL apt repository (not Docker Hub): see
    # scripts/ci-postgres.sh.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchscanner
      # Not a real secret - CI never talks to production anything. apps/api's own startup check
      # only hard-fails on the insecure default when NODE_ENV=production, which CI never sets.
      JWT_SECRET: ci-test-secret-not-used-anywhere-real-00000000

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 18
        run: ./scripts/ci-postgres.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every change to the extension bumps its version (user rule 2026-10-24). Each run compares
      # with a fixed commit, never with whatever main is by the time the step runs: a push to main
      # with the commit it moved main from, a pull request with the first parent of its merge
      # commit (the base it was merged onto; read from the commit itself, as the checkout is
      # shallow). Comparing with the live main failed runs when another extension bump landed
      # in between (run 40549020208; and this PR's own first run).
      - name: Extension version bump
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          BASE_SHA=$BEFORE
          if [ "$EVENT" = pull_request ]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          BASE_SHA=$BASE_SHA ./scripts/check-extension-version.sh

      # Fails on a high or critical advisory in what ships (dev-only advisories are not gated here)
      # - a known-vulnerable runtime dependency should not reach a deploy unnoticed.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Builds the Prisma client + compiles packages/core - every other workspace's typecheck/
      # build/test imports @trenchscanner/core's dist output, so this has to happen first.
      - name: Build packages/core
        run: npm run build -w @trenchscanner/core

      # Every key render.yaml sets must be one the config schema reads, each service must declare
      # the keys it reads, and code reads process.env only through the schema - see the script.
      - name: Check render.yaml keys against the env schema
        run: ./scripts/check-env-keys.sh

      - name: Apply migrations to the CI database
        run: npm run prisma:deploy

      # A new migration that locks a large table must set a lock_timeout - see the script.
      - name: Check big-table migrations set a lock_timeout
        run: ./scripts/check-migration-locks.sh

      # No two migrations may share a timestamp, so their order never falls to their names.
      - name: Check migration timestamps are unique
        run: ./scripts/check-migration-timestamps.sh

      - name: Check migrations re-run safely and match the schema
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow'
          SHADOW_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/shadow ./scripts/check-migrations.sh

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Also the typecheck: every workspace's build runs tsc over the same tsconfig its typecheck
      # script does, so a separate Typecheck step only repeated it (42 s; full audit 2026-10-27, CH-8).
      - name: Build all workspaces
        run: npm run build

      # Pinned: js-yaml is not a dependency here, so an unpinned npx would fetch whatever was
      # published last, on every run.
      - name: Validate render.yaml
        run: npx -y js-yaml@4.3.2 render.yaml > /dev/null

      # The nightly full-database dump and its restore (scripts/db-backup) are shell scripts the
      # Node checks above never read; a syntax error in one would show only at 02:30 or mid-restore.
      - name: Check the database backup scripts parse
        run: for f in scripts/db-backup/*.sh; do bash -n "$f"; done

  # Each workspace's tests on a runner of their own, at the same time as the checks above. They
  # need only packages/core built (the workspaces import its dist output) and the migrations
  # applied to their own Postgres.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A test waiting on a socket would otherwise hold the runner for six hours.
    timeout-minutes: 30
    strategy:
      # Every workspace's failures in one run, not just the first to fail.
      fail-fast: false
      matrix:
        include:
          # packages/core's model-training tests are most of the suite's time: two runners, each
          # taking half its files (vitest --shard).
          - name: core 1/2
            workspaces: -w @trenchscanner/core -- --shard=1/2
          - name: core 2/2
            workspaces: -w @trenchscanner/core -- --shard=2/2
          # api's files run one at a time (its vitest config), which made it the slowest job at
          # 4.5 minutes of tests (full audit 2026-10-27, CH-8): two runners, half the files each.
          - name: api 1/2
            workspaces: -w @trenchscanner/api -- --shard=1/2
          - name: api 2/2
            workspaces: -w @trenchscanner/api -- --shard=2/2
          # web's and the extension's tests take seconds and need no database; they ride with worker's.
          - name: worker and web
            workspaces: -w @trenchscanner/worker -w @trenchscanner/web -w @trenchscanner/extension

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchscanner
      JWT_SECRET: ci-test-secret-not-used-anywhere-real-00000000
      # A database suite that can't reach Postgres fails the run instead of passing as skipped
      # (vitest.requireDb.ts; full audit 2026-10-27, CH-11).
      REQUIRE_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v4

      # PostgreSQL 18 from the PostgreSQL apt repository, as in the checks job (no Docker Hub pull).
      - name: Start PostgreSQL 18
        run: ./scripts/ci-postgres.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build packages/core
        run: npm run build -w @trenchscanner/core

      - name: Apply migrations to the CI database
        run: npm run prisma:deploy

      - name: Test
        run: npm test ${{ matrix.workspaces }}

  # The one check that says the whole run passed, under the job name the single-job workflow had,
  # so anything waiting on a "ci" check (branch protection, the batch threads) still finds one.
  # What Render builds, built the way Render builds it (full audit 2026-10-27, CH-10). The jobs
  # above build packages/core first, so a web import that needs core's build output passed CI and
  # failed the static sites' deploy; and the backup cron's image was never built at all.
  deploy-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # render.yaml's trenchscanner-web and trenchscanner-asyl buildCommands, from a clean checkout
      # (core not built). Kept in step with render.yaml by hand.
      - name: Build the web and Asyl sites as Render does
        run: |
          npm ci --include=dev
          npm run build -w @trenchscanner/web
          rm -rf apps/web/dist-asyl && cp -r apps/web/dist apps/web/dist-asyl
          cp apps/web/dist/asyl/index.html apps/web/dist-asyl/index.html
          rm -rf apps/web/dist-asyl/tokensage apps/web/dist-asyl/sw.js

      # trenchscanner-db-backup's image. Its base comes from Google's Docker Hub mirror and is
      # tagged locally, so the build itself pulls nothing from Docker Hub (see the checks job).
      - name: Build the database backup image
        run: |
          docker pull -q mirror.gcr.io/library/postgres:18-alpine
          docker tag mirror.gcr.io/library/postgres:18-alpine postgres:18-alpine
          docker build -q -t trenchscanner-db-backup scripts/db-backup
          docker run --rm trenchscanner-db-backup bash -c 'for f in /app/*.sh; do bash -n "$f"; done && pg_dump --version && aws --version'

  ci:
    if: always()
    needs: [checks, test, deploy-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo 'checks: ${{ needs.checks.result }}, test: ${{ needs.test.result }}, deploy-builds: ${{ needs.deploy-builds.result }}'
          test '${{ needs.checks.result }}' = success && test '${{ needs.test.result }}' = success && test '${{ needs.deploy-builds.result }}' = success

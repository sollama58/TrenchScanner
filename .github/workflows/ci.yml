name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock - prisma:deploy actually applies every migration against it,
    # which catches migration-file drift/corruption that a schema-only check would miss. It is the
    # runner image's own PostgreSQL 16 (installed, service off by default), started below: a
    # postgres:16 service container pulls from Docker Hub, whose anonymous pull quota the shared
    # runner IPs exhaust from time to time, and then CI fails before its first step
    # (2026-10-09, PRs #309 and #330).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trenchscanner
      # Not a real secret - CI never talks to production anything. apps/api's own startup check
      # only hard-fails on the insecure default when NODE_ENV=production, which CI never sets.
      JWT_SECRET: ci-test-secret-not-used-anywhere-real-00000000

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';" -c "CREATE DATABASE trenchscanner;"
          pg_isready -h localhost -p 5432 -U postgres

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on a high or critical advisory in what ships (dev tooling is checked separately by
      # Dependabot) - a known-vulnerable runtime dependency should not reach a deploy unnoticed.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Builds the Prisma client + compiles packages/core - every other workspace's typecheck/
      # build/test imports @trenchscanner/core's dist output, so this has to happen first.
      - name: Build packages/core
        run: npm run build -w @trenchscanner/core

      # Every key render.yaml sets must be one the config schema reads - see the script.
      - name: Check render.yaml keys against the env schema
        run: ./scripts/check-env-keys.sh

      - name: Apply migrations to the CI database
        run: npm run prisma:deploy

      - name: Check migrations re-run safely and match the schema
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE shadow'
          SHADOW_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/shadow ./scripts/check-migrations.sh

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate render.yaml
        run: npx -y js-yaml render.yaml > /dev/null

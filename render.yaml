# TrenchScanner Render Blueprint
#
# Five services, one Postgres database:
#   - trenchscanner-api     Fastify REST API (SIWS auth, filters, matches)
#   - trenchscanner-worker  Background scanner (discovery, scoring, rug screen, alerts, labels)
#   - trenchscanner-trainer Model trainer (contest training, AI judge loop, nightly sweeps)
#   - trenchscanner-web     Static dashboard (apps/web: Live, Model & AI, Filters)
#   - trenchscanner-db      Managed Postgres
#
# The worker and the trainer are the same build with a different WORKER_ROLE (see
# HEARTBEAT_JOB_ROLE in packages/core/src/heartbeat.ts). They were one process until 2026-10-05:
# a training run is minutes of a full CPU on the same single core as the one-minute scan, the
# training set's memory is what capped how much history the models could see, and a crashed
# training run took the scanner down with it. GET /health/worker reports both, each job labelled
# with the process that owns it.
#
# Two dashboards talk to the API: this repo's own apps/web on trenchscanner-web (custom domain
# trenchscanner.app, with the API on api.trenchscanner.app), and the CultScreener/HolDEX site's
# /trenches/ tab (https://github.com/sollama58/CultScreener) on holdex.live. That is why
# CORS_ORIGINS and PUBLIC_APP_DOMAIN below list both, and the old onrender.com hosts too.
#
# After the first deploy, fill in the envVars marked `sync: false` below
# from the Render dashboard (Environment tab on each service):
#   - HELIUS_API_KEY (both api + worker)          https://dev.helius.xyz
#   - ANTHROPIC_API_KEY (worker + trainer)          https://console.anthropic.com
#         Turns on the AI buy/no-buy reviewer (AI_REVIEW_MODE, shadow by default), its daily
#         playbook evolution (AI_PLAYBOOK_EVOLUTION) and Claude's text features for the models
#         (AI_TEXT_FEATURES). Left empty all three are off and alerts flow exactly as before.
#         With the key set, all three still wait on the Admin > AI reviewer switch, which starts
#         "Off": "Test, admins only" runs the reviewer in shadow with its verdicts shown to admins
#         only (never holding an alert back or moving a live bot) and its playbook held fixed;
#         "Live" applies AI_REVIEW_MODE in full. No redeploy to flip it.
#         All three share a hard daily cap, AI_DAILY_BUDGET_USD ($15/day by default); once it is
#         reached the AI stops until midnight UTC (see /health/worker and Admin > AI).
#   - TOKENSAGE_API_URL, TOKENSAGE_API_KEY (worker)  optional: the user's TokenSage service
#         TokenSage says what each scanned coin is about (tokensage/prefetch.ts), stored in
#         TokenNarrative. Off until TOKENSAGE_ENABLED=true is also set; nothing waits on it.
#         Set TOKENSAGE_ENABLED the same on all three Node services (api, worker AND trainer):
#         it decides whether the Narrative model seat is on the roster in each process
#         (packages/core/src/config/env.ts), so a flag set on the worker alone has the scanner
#         wait on a seat the trainer never trains.
#   - TOKENSAGE_XREUSE_RESTORED_AT (api, worker AND trainer)  leave empty until TokenSage's X-reuse
#         and wave counts are whole again (TokenSage #85 with TRUSTED_HINT_KEYS set), then the ISO
#         time that went live plus a day. Until then the models read those inputs as missing on
#         rows and decisions since TokenSage #81 (TOKENSAGE_XREUSE_LOST_FROM, curation/features.ts).
#   - TOKENSAGE_API_URL, TOKENSAGE_MONITOR_KEY (api)  optional: TokenSage's read-only MONITOR_KEY
#         Admin > API usage then shows TokenSage's own outside calls and Helius credits next to
#         ours (apps/api/src/routes/adminUsage.ts). Unset, that panel says so.
#   - COINGECKO_API_KEY (api, worker + trainer)    optional: a CoinGecko paid-plan key
#         Market data falls back to GeckoTerminal whenever DexScreener answers lookups blank (it
#         did on 2026-10-07). Free, that is 30 calls a minute; with this key it is CoinGecko's
#         on-chain API on the plan's limit (COINGECKO_REQUESTS_PER_MINUTE, 200 by default).
#   - JUPITER_API_KEY (worker)                      optional: a Jupiter API key (portal.jup.ag)
#         The outcome watcher and the empty-wallet check price on Jupiter's Tokens API first (100
#         mints a call, a per-account limit) and on DexScreener only for what it missed, so
#         DexScreener's per-IP budget goes to the scan's refresh and fast-match. The limits default
#         to the Developer plan (JUPITER_REQUESTS_PER_SECOND 8, JUPITER_MONTHLY_CREDITS 25M, which
#         works out to 50 search calls a minute at 10 credits each). Free plan: set 1 and 0.
#   - SOLANA_TRACKER_API_KEY (worker)               optional: a Solana Tracker key (free plan is enough)
#         The worker reads Solana Tracker's KOL roster once a day (jobs/kolWalletsJob.ts), and the
#         dashboard labels those wallets as KOLs with their name and X handle.
#   - SOLANA_RPC_URL (both api + worker)           optional: leave empty to use Helius
#         Verifies and reconciles burns. Empty (or a public endpoint) means the Helius RPC built
#         from HELIUS_API_KEY; set it only to use a different paid RPC.
#   - ADMIN_WALLET_ADDRESSES (api only)            your own wallet's base58 address, to reach /admin
#   - TELEGRAM_BOT_TOKEN (api + worker)            optional: a bot token from @BotFather
#         Turns on Telegram alerts (Filters tab -> Telegram alerts): the api runs the bot's webhook
#         and link codes, the worker sends each linked chat its alerts. Empty, the feature is off.
#   - WEB_PUSH_PUBLIC_KEY (api + worker), WEB_PUSH_PRIVATE_KEY (worker)  optional: a VAPID key pair
#         Turns on push notifications with the app closed (Settings -> Alerts -> Browser
#         notifications). Generate with `npx web-push generate-vapid-keys`. Empty, the feature is off.
#   - TRADING_KMS_KEY_ID, TRADING_AWS_ACCESS_KEY_ID, TRADING_AWS_SECRET_ACCESS_KEY (api + trader,
#     optional; with TRADING_BOT_ENABLED=true)
#         Custody for the admin-only trading bot's wallets (README -> Trading bot). One KMS key,
#         and a DIFFERENT IAM user per service: the api's may only kms:GenerateDataKey (it creates
#         wallets), the trader's may only kms:Decrypt (it signs). The trader also needs
#         HELIUS_API_KEY (or SOLANA_RPC_URL) and ADMIN_WALLET_ADDRESSES; TRADING_JUPITER_API_KEY
#         is recommended (its own Jupiter key for swaps).
#   - TRADING_SERVER_WALLET_SECRET_KEY (trader only), TRADING_SERVER_WALLET_ADDRESS and
#     TRADING_SERVER_WALLET_WITHDRAW_TO (api + trader), optional
#         A server wallet whose key you supply, traded by a bot every admin controls (Admin ->
#         Trading bot -> Server wallet). Withdrawals go only to TRADING_SERVER_WALLET_WITHDRAW_TO.
#   - MODEL_BACKUP_S3_ENDPOINT, _BUCKET, _ACCESS_KEY_ID, _SECRET_ACCESS_KEY (trainer only, optional)
#         Off-site copies of the weekly model backups to any S3-compatible bucket (Cloudflare R2,
#         Backblaze B2, AWS S3); MODEL_BACKUP_S3_REGION defaults to "auto" (R2). Unset, backups
#         stay in Postgres only (Admin tab -> Backups) and can still be downloaded from there.
#         The nightly full-database dump (trenchscanner-db-backup) takes the same four keys.
#
# DATABASE_CONNECTION_LIMIT is set (not sync: false - it ships with a value) on all three Node
# services below. Verify the three values, plus the connections held outside the pools - the API's
# one LISTEN connection (its SSE push, apps/api/src/matchStream.ts) and one per batch job running
# under its job lock (apps/worker/src/jobLock.ts: up to three on the scanner - pro-holders,
# trade-tape, kol-wallets - and up to eight on the trainer) - against the actual connection
# ceiling on the Postgres plan you deploy to (Render dashboard -> the database -> Info tab; the
# Admin tab's Database panel shows the live count against it). The live ceiling read 103 (max_connections, /stats/db, 2026-10-19 database audit), not the
# 200 assumed before: ~45 steady, so the ~2x overlap of a deploy reaches ~90 of the 100 usable.
# Adjust downward if you move to a plan with a lower ceiling,
# or if you scale any service to more than one instance - every instance opens its own pool, and
# during a deploy the old and new instances are both connected for a while (Render keeps the old
# one up through the health check plus maxShutdownDelaySeconds), so the peak is about twice the
# steady total (plus the three preDeploy migrate sessions).
#
# See PLANNING.md and README.md for the full architecture and local dev setup.

# Only plain, static key/value pairs can live in a shared env var group - Render's Blueprint
# schema doesn't allow a group's envVars to use fromDatabase (references another resource) or
# sync: false (a per-service manual-entry placeholder). DATABASE_URL/HELIUS_API_KEY need one of those, so they're declared directly on
# each service that needs them below instead of here.
envVarGroups:
  - name: trenchscanner-shared
    envVars:
      - key: DEXSCREENER_BASE_URL
        value: https://api.dexscreener.com
      - key: PUMPFUN_BASE_URL
        value: https://frontend-api-v3.pump.fun
      - key: NODE_ENV
        value: production
      # Pro trades from the token modal for every Pro Mode wallet: grants and the top 250 holders
      # (api), with the Pro holder scan running (worker). User ask 2026-10-18 04:09 UTC, after
      # shipping admins-only at 02:17. "false" takes it back to the admin wallets alone.
      - key: PRO_TRADING_PUBLIC
        value: "true"
      # Keys the wallet tags in logs (packages/core/src/walletTag.ts), in every service alike so
      # one wallet's tag matches across them. Changing it changes every tag from then on.
      - key: WALLET_TAG_SECRET
        generateValue: true

services:
  - type: web
    name: trenchscanner-api
    runtime: node
    plan: standard
    region: oregon
    # npm ci, as CI runs it: it installs exactly what package-lock.json pins, and fails rather than
    # resolving something else when the lockfile and a package.json disagree.
    # --include=dev: NODE_ENV=production (set below) makes npm omit devDependencies by default,
    # but prisma/typescript/dotenv-cli - all needed just to build - are devDependencies here.
    buildCommand: npm ci --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/api
    # Deploys only when something this service runs changes. Every merge used to rebuild and
    # restart all three Node services; a restart empties the scanner's in-memory books, cuts a
    # training run short and drops AI reviews in flight, and on 2026-10-13 main took 68 merges, 19
    # of them touching nothing the worker runs (full audit 2026-10-14, lane 7, F2). The paths are
    # what the build and the preDeploy read: the app, packages/core (built into it, and the Prisma
    # schema and migrations prisma:deploy applies), the root manifests and lockfile npm ci installs
    # from, tsconfig.base.json the app's tsconfig extends, the Node version, the migration script,
    # and this file. Tests and Markdown change nothing that runs. A manual deploy from the
    # dashboard is not filtered.
    buildFilter:
      paths:
        - apps/api/**
        - packages/core/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .node-version
        - scripts/migrate-deploy.sh
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    startCommand: npm run start -w @trenchscanner/api
    # Runs once per deploy, before the new instance takes traffic - applies any pending
    # migrations. The worker and trainer declare it too, so neither starts new code against a
    # schema that has not been migrated yet. The three deploy at once; scripts/migrate-deploy.sh
    # waits out whichever of them is already migrating (the others then find nothing to apply)
    # and retries a migration that hit its lock_timeout.
    preDeployCommand: npm run prisma:deploy
    # Deploy a merge to main only once its CI run (.github/workflows/ci.yml) has passed: a commit
    # that fails typecheck or a test never reaches production. 2026-10-16 database audit.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # Seconds from SIGTERM to SIGKILL (Render's default is 30). A deploy no longer cuts off Pro
    # trades in flight: the old instance keeps resending them until they land or expire, up to
    # 75s (apps/api/src/routes/proTrade.ts, DRAIN_MAX_MS), under the api's own 85s
    # SHUTDOWN_DEADLINE_MS (apps/api/src/index.ts). Raise those three together. A shutdown with no
    # trade in flight still ends at once.
    maxShutdownDelaySeconds: 90
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # Sized explicitly rather than left to Prisma's own `num_physical_cpus * 2 + 1` default,
      # which computes from whatever CPUs the instance reports, not from what a service needs (on
      # the `starter` instances these services first ran on it came out at 9 for both) - too tight
      # here, where the Live Feed route alone (apps/api/src/routes/matches.ts) fans out up to four
      # concurrent Prisma calls per request and is polled by every open tab every 45s. 12 covers a
      # real burst of concurrent requests on a single instance with room to spare.
      #
      # Verify this against the ACTUAL number in Render's Postgres dashboard (Info tab) before
      # raising it: this plus the worker's own limit below, plus the one dedicated LISTEN
      # connection this service holds outside the pool (apps/api/src/matchStream.ts), all draw
      # from the same ceiling.
      - key: DATABASE_CONNECTION_LIMIT
        value: "12"
      - key: HELIUS_API_KEY
        sync: false
      # Optional: a CoinGecko paid-plan key for the market-data fallback (see .env.example).
      - key: COINGECKO_API_KEY
        sync: false
      # Optional: TokenSage's URL and its read-only MONITOR_KEY, for TokenSage's own meter on Admin >
      # API usage (apps/api/src/routes/adminUsage.ts). The scanner's TOKENSAGE_API_KEY is not needed
      # here. TOKENSAGE_ADMIN_KEY is the deprecated fallback: delete its value once the monitor key
      # is set (security audit 2026-10-16).
      - key: TOKENSAGE_API_URL
        sync: false
      - key: TOKENSAGE_MONITOR_KEY
        sync: false
      # Empty until TokenSage's X-reuse and wave counts are whole again (TokenSage #85 with
      # TRUSTED_HINT_KEYS set on its worker): then the ISO time that went live plus a day. Until set,
      # the model explanations read those inputs as missing since #81, as the worker scores them.
      # Set it the same on the api, worker and trainer (packages/core/src/config/env.ts).
      - key: TOKENSAGE_XREUSE_RESTORED_AT
        sync: false
      - key: TOKENSAGE_ADMIN_KEY
        sync: false
      # Verifies burns for /subscription/claim and mints the blockhash the burn is signed
      # against. Empty (or a public endpoint) uses the Helius RPC built from HELIUS_API_KEY, so it
      # only needs a value to point at a different paid RPC.
      - key: SOLANA_RPC_URL
        sync: false
      # Pro trades (routes/proTrade.ts, proTrades.ts, trading.ts), all optional: a second RPC from
      # another provider, asked when the first gives no answer and sent every transaction too;
      # Pro trades' own Jupiter key (empty: Jupiter's keyless hosts); and Helius Sender's endpoint
      # (empty: the global https://sender.helius-rpc.com/fast). Declared so they survive a Blueprint
      # re-create (user decision 2026-10-20).
      - key: TRADING_BACKUP_RPC_URL
        sync: false
      - key: PRO_TRADING_JUPITER_API_KEY
        sync: false
      - key: HELIUS_SENDER_URL
        sync: false
      # Email sign-in through Privy (apps/api/src/privy.ts): on only when all three are set, from the
      # Privy dashboard (App settings: App ID, App secret, and the JWKS endpoint, an https URL on
      # auth.privy.io). JWT_SECRET also keeps two-factor secrets sealed, so rotating it
      # turns everyone's authenticator app off.
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_JWKS_ENDPOINT
        sync: false
      # Privy accounts allowed in all (user decision 2026-10-18).
      - key: PRIVY_SIGNUP_CAP
        value: "400"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "168"
      # Every host a dashboard is served from - trenchscanner.app and the CultScreener/HolDEX site
      # each answer on both apex and www, plus trenchscanner-web's own onrender.com host. An origin
      # missing here is silently blocked by the browser.
      - key: CORS_ORIGINS
        value: https://trenchscanner.app,https://www.trenchscanner.app,https://holdex.live,https://www.holdex.live,https://trenchscanner-web.onrender.com,https://asyl.trenchscanner.app
      # Anti-phishing anchor for Sign-In With Solana - the canonical host of each dashboard, no
      # protocol, comma-separated. Each sign-in is bound to the listed host its request came from;
      # anything else gets the first entry, which its wallet refuses to sign. A missing host breaks
      # sign-in on that dashboard outright. See the comment on this var in
      # packages/core/src/config/env.ts.
      #
      # Also decides the session cookie's SameSite: this API compares the host it was reached on
      # against this value per request. While it answers on trenchscanner-api.onrender.com that is
      # cross-site, so the cookie needs SameSite=None - a third-party cookie, which Safari and
      # Brave block outright, so sign-in fails there. The custom domain api.trenchscanner.app on
      # this service fixes it for trenchscanner.app: requests arriving on that host are same-site
      # and get SameSite=Lax automatically. See the comment above sessionCookieAttrs in
      # apps/api/src/routes/auth.ts.
      - key: PUBLIC_APP_DOMAIN
        value: trenchscanner.app,www.trenchscanner.app,holdex.live,trenchscanner-web.onrender.com,asyl.trenchscanner.app
      # Comma-separated base58 wallet addresses allowed into the Admin Panel - set this to your
      # own wallet's address after the first deploy. Empty means the Admin Panel 403s everyone.
      - key: ADMIN_WALLET_ADDRESSES
        sync: false
      # Bearer token for GET /stats/hit-rates, the read-only hit-rate report (see README). At
      # least 32 characters; empty leaves the route switched off (404).
      - key: STATS_API_TOKEN
        sync: false
      # Telegram alerts (see packages/core/src/telegram): the bot token from @BotFather. Empty
      # leaves the feature off. Set on this service and the worker below.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Where Telegram delivers the bot's updates: this service's public webhook route.
      - key: TELEGRAM_WEBHOOK_URL
        value: https://trenchscanner-api.onrender.com/telegram/webhook
      # Web Push alerts (packages/core/src/webPush): the VAPID public key the dashboard subscribes
      # with. Empty leaves the feature off. The worker below needs it too, with the private key.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      # The trading bot (admin-only, packages/core/src/trading). Off until the KMS key and this
      # service's IAM user (kms:GenerateDataKey only) are in place; flip on here and on the trader.
      - key: TRADING_BOT_ENABLED
        value: "false"
      - key: TRADING_KMS_KEY_ID
        sync: false
      - key: TRADING_KMS_REGION
        value: us-east-1
      - key: TRADING_AWS_ACCESS_KEY_ID
        sync: false
      - key: TRADING_AWS_SECRET_ACCESS_KEY
        sync: false
      # The server wallet's PUBLIC address and where its withdrawals go (both public). Its secret
      # key is set on the trader only - never here.
      - key: TRADING_SERVER_WALLET_ADDRESS
        sync: false
      - key: TRADING_SERVER_WALLET_WITHDRAW_TO
        sync: false
      # Admin > Backups' full database dumps (packages/core/src/backup/dbDumps.ts): the dumps
      # bucket the trenchscanner-db-backup cron writes, with a READ-ONLY R2 token for that bucket
      # only (README -> Backups and restore). Unset, the panel lists nothing and says so.
      - key: DB_DUMP_S3_ENDPOINT
        sync: false
      - key: DB_DUMP_S3_BUCKET
        sync: false
      - key: DB_DUMP_S3_ACCESS_KEY_ID
        sync: false
      - key: DB_DUMP_S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: trenchscanner-worker
    runtime: node
    plan: standard
    region: oregon
    # See the api service's buildCommand comment above - same reason.
    buildCommand: npm ci --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
    # See the api service's buildFilter above. The scanner and the trainer are the same build, so
    # they share one filter.
    buildFilter:
      paths:
        - apps/worker/**
        - packages/core/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .node-version
        - scripts/migrate-deploy.sh
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    startCommand: npm run start -w @trenchscanner/worker
    # The same migration step as the api's (see there), so this never boots ahead of the schema.
    preDeployCommand: npm run prisma:deploy
    # Deploy a merge to main only once its CI run (.github/workflows/ci.yml) has passed: a commit
    # that fails typecheck or a test never reaches production. 2026-10-16 database audit.
    autoDeployTrigger: checksPass
    # Seconds from SIGTERM to SIGKILL. Render's default is 30s; a shadow AI review in flight is given its whole
    # AI_REVIEW_SHADOW_TIMEOUT_MS (120s) plus the heartbeat writes before the process ends (worker
    # index.ts, REVIEW_DRAIN_SLACK_MS), so a deploy no longer cuts one off. Raise this with that
    # timeout. A shutdown with no review in flight still ends as soon as its runs settle.
    maxShutdownDelaySeconds: 135
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # See the api service's DATABASE_CONNECTION_LIMIT above for why this is set explicitly at
      # all. The worker's own number is sized differently: its scan cycle processes up to
      # CANDIDATE_CONCURRENCY (apps/worker/src/jobs/scanJob.ts, 15 at the time of writing) tokens
      # at once, each doing its own DB writes, and a limit below that would have the worker
      # queue against its OWN concurrency rather than anything external - self-inflicted
      # contention on every scan cycle, not just under unusual load. 18 clears the scan cycle;
      # it does not clear the scan cycle plus everything else on this process that shares the
      # pool - candidate-watch's UPDATE_CONCURRENCY (10), fast-match's MATCH_CONCURRENCY (4), the
      # Telegram pass-lock transaction and trade-tape's write transaction - so when a
      # candidate-watch sweep lands on a scan cycle, callers queue for up to pool_timeout (20 s)
      # and a P2024 drops that candidate's snapshot for the cycle. Verify the api+worker+trainer
      # total against the Postgres plan's real connection ceiling before raising it.
      - key: DATABASE_CONNECTION_LIMIT
        value: "18"
      # The alert path and label grading only; training and the nightly sweeps run on the
      # trainer service below.
      - key: WORKER_ROLE
        value: scanner
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOKENSAGE_API_URL
        sync: false
      - key: TOKENSAGE_API_KEY
        sync: false
      # Empty until TokenSage's X-reuse and wave counts are whole again (TokenSage #85 with
      # TRUSTED_HINT_KEYS set on its worker): then the ISO time that went live plus a day. Until set,
      # the seats score those inputs as missing on live decisions since #81 (curatedAlerts.ts).
      # Set it the same on the api, worker and trainer (packages/core/src/config/env.ts).
      - key: TOKENSAGE_XREUSE_RESTORED_AT
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      # Optional: a CoinGecko paid-plan key for the market-data fallback (see .env.example).
      - key: COINGECKO_API_KEY
        sync: false
      # Optional: a Jupiter API key (portal.jup.ag). The outcome watcher and the empty-wallet
      # check then price on Jupiter first, leaving DexScreener to the scan. The limits default to
      # the Developer plan (see the note at the top); JUPITER_REQUESTS_PER_SECOND and
      # JUPITER_MONTHLY_CREDITS override them.
      - key: JUPITER_API_KEY
        sync: false
      # Optional: a Solana Tracker key (solanatracker.io, free plan). The worker reads its KOL
      # roster once a day, and the dashboard labels those wallets as KOLs.
      - key: SOLANA_TRACKER_API_KEY
        sync: false
      # The burn reconciler's endpoint - see the note on this var on the API above. Empty means
      # Helius via HELIUS_API_KEY.
      - key: SOLANA_RPC_URL
        sync: false
      # Optional: paid Solana RPCs (comma-separated, another provider than Helius) the scan's
      # Pump.fun launch proof falls back to when Helius is rate limited or down.
      - key: CHAIN_BACKUP_RPC_URLS
        sync: false
      # Optional: the Helius plan's credits a month and the UTC day its billing cycle starts (1 by
      # default). pipeline-watch (this service) tells the admins at 75/90/97% of the plan and when
      # the last day's rate would run it out early; unset, the budget alarm is off.
      - key: HELIUS_MONTHLY_CREDITS
        sync: false
      - key: HELIUS_CYCLE_START_DAY
        sync: false
      # One minute (user decision 2026-10-22; it was thirty seconds). Every Helius budget in the
      # scan is per cycle, so the cadence sets Helius spend per minute: with the band wake (#874)
      # starting cycles early the scan ran ~3.6 times a minute and spent ~2.1M credits a day, which
      # ran the plan out (notes/audit-2026-10-22, C1). Speed for a coin entering the band comes from
      # the entry fast path below instead, which scans that one coin as it crosses. RugCheck
      # requests follow RUGCHECK_CACHE_TTL_MINUTES (the worker's rugCheckProfiles.ts), and snapshot
      # and liveness writes are spaced in wall-clock time (scanJob.ts), so neither moves with it.
      - key: SCAN_INTERVAL_MINUTES
        value: "1"
      # The entry fast path (worker's entryFastPath.ts, user decision 2026-10-22): a young launch
      # that holds the band's floor for 2.5 s between cycles gets its first scan at once, alone, on
      # the cycle's own stages, instead of starting the whole cycle early as the band wake did. At
      # most ENTRY_FAST_PATH_MAX_PER_MINUTE a minute; the rest wait for the cycle. "false" turns it off.
      - key: ENTRY_FAST_PATH_ENABLED
        value: "true"
      - key: ENTRY_FAST_PATH_MAX_PER_MINUTE
        value: "30"
      # A fast scan waits up to this long for TokenSage's quick read (asked for at the crossing)
      # before deciding, then scans the coin as it is now (user decision 2026-10-26). "0" turns
      # the hold off.
      - key: ENTRY_READ_HOLD_SECONDS
        value: "20"
      # Per-CYCLE Helius budgets. Curated contenders' wallets are looked up first, the rest
      # behind the cycle on what is left. Freshness is back at its one-minute value, 50 (the env
      # default), with the cycle back at a minute (user decision 2026-10-22): it was halved to 25
      # while the cycle ran twice a minute, to keep spend per minute the same, so per-minute
      # coverage is what it was. Holdings was cut from 15 to 10 on 2026-10-04 to save Helius
      # credits: each lookup costs 10 credits and the old budget filled every cycle (~88% of all
      # Helius spend). 10 is the floor - a top-10 holder group is all-or-nothing, so a smaller
      # budget could never complete a contender whose wallets are all uncached.
      - key: WALLET_FRESHNESS_MAX_LOOKUPS_PER_CYCLE
        value: "50"
      - key: WALLET_HOLDINGS_MAX_LOOKUPS_PER_CYCLE
        value: "10"
      # The live tape (worker's liveTape.ts): newest-trade pages of the coins close to a call, the
      # source of every winner-wallet and flagged-wallet input. The cap is per cycle, so the one-minute
      # cycle (#953) cut it from 8 pages a minute to 4. User decision 2026-10-23 (thread "Winners model
      # signal"): back to 8 a minute, about 58k more Helius credits a day than 4. User decision
      # 2026-10-27 (model audit, §18): 15. Since #1118 the page is also every coin's 5m order flow
      # and launch bags (the PumpPortal free tier carries no trades), and at 8 the queue was about
      # saturated: ~40 coins held a page, re-read every 3 minutes, against 9-14 pages read a cycle
      # (the entry fast path reads under the same cap). 15 is at most ~150k more credits a day.
      - key: LIVE_TAPE_PAGES_PER_CYCLE
        value: "15"
      - key: RUGCHECK_CACHE_TTL_MINUTES
        value: "5"
      # Wall-clock span holderGrowthPct is measured over, deliberately independent of the scan
      # cadence above so shortening it doesn't silently redefine every user's threshold.
      - key: HOLDER_GROWTH_WINDOW_MINUTES
        value: "30"
      - key: MCAP_FILTER_MIN
        # 10000 -> 7000 (user decision 2026-10-20): calls from $7k, on the way up.
        value: "7000"
      - key: MCAP_FILTER_MAX
        value: "1000000"
      - key: WATCHLIST_TTL_HOURS
        value: "24"
      # 900 -> 600 (user decision 2026-10-19, performance audit): 30 DexScreener batches a cycle
      # sat at the rate gate's burst, so the market refresh alone took 2-7 s of each scan. The
      # near-band tier and the newest launches are refreshed first, so the cut falls on the
      # launch-level tail.
      - key: WATCHLIST_MAX_TRACKED
        value: "600"
      - key: CLEANUP_HOUR_UTC
        value: "4"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: STALE_TOKEN_RETENTION_DAYS
        value: "14"
      # Retention decided 2026-10-16 (database audit): the trade tape's wallet rows 30 days (wallet risk, a model input, reads them all), every
      # training row 90 days and the ones that doubled (or a curated call points at) 180, the Live
      # feed 30 days with its archive 90 days and the archived runners 180. See env.ts.
      - key: TWA_RETENTION_DAYS
        value: "30"
      - key: CANDIDATE_OUTCOME_RETENTION_DAYS
        value: "90"
      - key: CANDIDATE_OUTCOME_HIT_RETENTION_DAYS
        value: "180"
      - key: MATCH_ARCHIVE_DAYS
        value: "30"
      - key: MATCH_ARCHIVE_RETENTION_DAYS
        value: "90"
      - key: MATCH_ARCHIVE_HIT_RETENTION_DAYS
        value: "180"
      # pipeline-watch's warning line for the database's size: about 3 GB under the Postgres disk
      # (30 GB since 2026-10-16), raised together with it. See DB_DISK_ALERT_MB in
      # packages/core/src/config/env.ts and "When the database disk is nearly full" in the README.
      - key: DB_DISK_ALERT_MB
        value: "27000"
      - key: OUTCOME_TRACKING_HOUR_UTC
        value: "5"
      - key: ACTIVE_VIEW_WINDOW_MINUTES
        value: "10"
      # Live market-cap refresh for tokens someone currently has open - see livePriceJob.ts.
      # Cheap enough for a one-minute cadence: market data only, and no work at all when nobody
      # has the dashboard open.
      - key: LIVE_PRICE_INTERVAL_MINUTES
        value: "1"
      - key: LIVE_PRICE_MAX_TRACKED
        value: "150"
      # The same bot token as on the api: this process sends the alerts (telegram-dispatch).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DASHBOARD_URL
        value: https://trenchscanner.app
      # Web Push alerts: this process sends them (web-push-dispatch). The same public key as on
      # the api, and the pair's private key, which only this service holds.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      # The same list as on the api: the dispatcher sends real-time alerts only to accounts with
      # access (admin, whitelist or subscription), and this is how it recognises the admin wallets.
      - key: ADMIN_WALLET_ADDRESSES
        sync: false

  # ---- The trading bot's worker: NOT DEPLOYED while the bot is off (2026-10-15). ----
  # Uncomment this service (and follow README -> Trading bot -> launch checklist) only when the
  # bot is to be switched on: syncing the Blueprint with it creates a paid Render worker.
  # # The trading bot (admin-only, packages/core/src/trading): the same worker build, running only
  # # the trading-bot job. Its own process for two reasons. Custody: this is the ONLY service holding
  # # credentials that can open the bot's wallets (an IAM user allowed nothing but kms:Decrypt on the
  # # bot's key), so a bug or a compromised dependency on the scan path can never reach them. And
  # # timing: a stop-loss never waits behind a slow scan cycle or a retrain, and a crash elsewhere
  # # never leaves open positions unwatched. Exactly one instance: the engine also takes a Postgres
  # # advisory lock per pass, but scaling this out buys nothing.
  # - type: worker
  #   name: trenchscanner-trader
  #   runtime: node
  #   plan: starter
  #   region: oregon
  #   buildCommand: npm install --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
  #   startCommand: npm run start -w @trenchscanner/worker
  #   envVars:
  #     - fromGroup: trenchscanner-shared
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: trenchscanner-db
  #         property: connectionString
  #     # One pass at a time, a handful of queries each. Count it with the other services' pools
  #     # against the Postgres plan's connection ceiling (see the api service above).
  #     - key: DATABASE_CONNECTION_LIMIT
  #       value: "4"
  #     - key: WORKER_ROLE
  #       value: trader
  #     # Off until the KMS key and this service's IAM user (kms:Decrypt only) are in place; flip it
  #     # on here and on the api together (README -> Trading bot).
  #     - key: TRADING_BOT_ENABLED
  #       value: "false"
  #     - key: TRADING_KMS_KEY_ID
  #       sync: false
  #     - key: TRADING_KMS_REGION
  #       value: us-east-1
  #     - key: TRADING_AWS_ACCESS_KEY_ID
  #       sync: false
  #     - key: TRADING_AWS_SECRET_ACCESS_KEY
  #       sync: false
  #     # The chain reads and transaction sends: Helius from this key unless SOLANA_RPC_URL names
  #     # another paid RPC. A trading bot on the public RPC is a stop-loss waiting on a 429.
  #     - key: HELIUS_API_KEY
  #       sync: false
  #     - key: SOLANA_RPC_URL
  #       sync: false
  #     # Jupiter for swaps and prices: its own key so trades never share the scan's 60-a-minute plan.
  #     - key: TRADING_JUPITER_API_KEY
  #       sync: false
  #     # Only these wallets' bots open new positions (exits and withdrawals run for everyone).
  #     - key: ADMIN_WALLET_ADDRESSES
  #       sync: false
  #     # Optional: tells owners' private Telegram chats about each buy, sale and loss-limit pause.
  #     - key: TELEGRAM_BOT_TOKEN
  #       sync: false
  #     # The server wallet (README -> Trading bot -> Server wallet): its private key, as Phantom
  #     # exports it (base58) or a solana-keygen JSON array. THIS SERVICE ONLY. The address and
  #     # withdrawal destination below must match the api's.
  #     - key: TRADING_SERVER_WALLET_SECRET_KEY
  #       sync: false
  #     - key: TRADING_SERVER_WALLET_ADDRESS
  #       sync: false
  #     - key: TRADING_SERVER_WALLET_WITHDRAW_TO
  #       sync: false

  # The model trainer: the same worker build, running only the batch jobs (curator-training,
  # champion-refresh, ai-judge, cleanup, outcome-tracking, lighthouse-rollup). Its own instance so
  # that a training run - 5 to 6 minutes of a full core every CURATOR_TRAINING_INTERVAL_HOURS -
  # never competes with the scan for the one CPU, the training set (CURATOR_TRAINING_MAX_ROWS,
  # held twice while the training thread runs) has 2GB to itself, and a run that dies takes
  # nothing on the alert path with it. Needs no Helius or RPC key: everything it reads is already
  # in Postgres, plus DexScreener (with the CoinGecko fallback) for the nightly outcome sweep.
  - type: worker
    name: trenchscanner-trainer
    runtime: node
    plan: standard
    region: oregon
    # See the api service's buildCommand comment above - same reason.
    buildCommand: npm ci --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
    # The scanner's filter: the same build (see the api service's buildFilter).
    buildFilter:
      paths:
        - apps/worker/**
        - packages/core/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .node-version
        - scripts/migrate-deploy.sh
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    startCommand: npm run start -w @trenchscanner/worker
    # The same migration step as the api's (see there), so this never boots ahead of the schema.
    preDeployCommand: npm run prisma:deploy
    # Deploy a merge to main only once its CI run (.github/workflows/ci.yml) has passed: a commit
    # that fails typecheck or a test never reaches production. 2026-10-16 database audit.
    autoDeployTrigger: checksPass
    # Seconds from SIGTERM to SIGKILL. Render's default is 30s; a shadow AI review in flight is given its whole
    # AI_REVIEW_SHADOW_TIMEOUT_MS (120s) plus the heartbeat writes before the process ends (worker
    # index.ts, REVIEW_DRAIN_SLACK_MS), so a deploy no longer cuts one off. Raise this with that
    # timeout. A shutdown with no review in flight still ends as soon as its runs settle.
    maxShutdownDelaySeconds: 135
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # Training pages its rows in one query at a time and the sweeps run batched statements, so
      # a small pool is plenty. Count it with the api's and the worker's against the Postgres
      # plan's connection ceiling (see the api service above).
      - key: DATABASE_CONNECTION_LIMIT
        value: "6"
      # Above the 600 s statement timeout of the hourly wallet-book reads (apps/worker/src/jobs/
      # longReads.ts): at the default 180 s the client would drop the socket on a read Postgres
      # still allows, failing wallet-risk and kol-side-wallets while the query ran on. The trainer's
      # jobs have run deadlines of their own for a host that goes away mid-query.
      - key: DATABASE_SOCKET_TIMEOUT_SECONDS
        value: "660"
      - key: WORKER_ROLE
        value: trainer
      # Its own DexScreener budget, out of the per-IP 300 a minute: the scanner 180, the api 90
      # (LIVE_REFRESH_CALLS_PER_MINUTE), this 30, which add up to the 300 (full audit 2026-10-27,
      # DA-12: 180 + 120 + 60 went 60 past it). At the default 180 the daily outcome pass pushed the
      # three past the limit together (inferred from 429s in the API usage panel, 2026-10-20). It
      # reads one batch of up to 30 mints at a time, so 30 a minute still finishes thousands of
      # mints in minutes.
      - key: DEXSCREENER_REQUESTS_PER_MINUTE
        value: "30"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Empty until TokenSage's X-reuse and wave counts are whole again (TokenSage #85 with
      # TRUSTED_HINT_KEYS set on its worker): then the ISO time that went live plus a day. Until set,
      # training reads those inputs as missing on every row since #81 (maskTokenSageXReuseLoss).
      # Set it the same on the api, worker and trainer (packages/core/src/config/env.ts).
      - key: TOKENSAGE_XREUSE_RESTORED_AT
        sync: false
      # Optional: the same CoinGecko key as on the api and worker. The nightly outcome sweep
      # (outcome-tracking) looks up thousands of mints on DexScreener, with GeckoTerminal behind it
      # when DexScreener answers blank - 30 calls a minute without a key.
      - key: COINGECKO_API_KEY
        sync: false
      # Optional: the S3-compatible bucket for off-site copies of the weekly model backups
      # (model-backup runs here). MODEL_BACKUP_S3_REGION defaults to "auto" (R2).
      - key: MODEL_BACKUP_S3_ENDPOINT
        sync: false
      - key: MODEL_BACKUP_S3_BUCKET
        sync: false
      - key: MODEL_BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: MODEL_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      # The settings the batch jobs read that the scanner also carries, kept identical: the
      # curated band is what training grades decision moments inside, and the retention values
      # are what cleanup enforces.
      - key: MCAP_FILTER_MIN
        # 10000 -> 7000 (user decision 2026-10-20): calls from $7k, on the way up.
        value: "7000"
      - key: MCAP_FILTER_MAX
        value: "1000000"
      - key: CLEANUP_HOUR_UTC
        value: "4"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: STALE_TOKEN_RETENTION_DAYS
        value: "14"
      # The same retention as the scanner's block above: the trainer runs the nightly cleanup.
      - key: TWA_RETENTION_DAYS
        value: "30"
      - key: CANDIDATE_OUTCOME_RETENTION_DAYS
        value: "90"
      - key: CANDIDATE_OUTCOME_HIT_RETENTION_DAYS
        value: "180"
      - key: MATCH_ARCHIVE_DAYS
        value: "30"
      - key: MATCH_ARCHIVE_RETENTION_DAYS
        value: "90"
      - key: MATCH_ARCHIVE_HIT_RETENTION_DAYS
        value: "180"
      - key: OUTCOME_TRACKING_HOUR_UTC
        value: "5"

  # The nightly full-database backup (scripts/db-backup, README -> Backups and restore): pg_dump of
  # the whole database at 02:30 UTC, between the hourly jobs and well before the 04:00 cleanup,
  # and on an admin's "Dump now" (Admin > Backups). The cron starts every 10 minutes for that;
  # backup.sh ends at once unless the nightly dump or a requested one is due, so a start costs a
  # few seconds and one query. Render runs one start at a time.
  # streamed to the same bucket as the model backups (Cloudflare R2), checked by sha256 and by
  # reading it back, and the oldest past DB_DUMP_KEEP removed. It only reads: one connection
  # (count it with the pools above) and one snapshot for the few minutes the dump takes. Until
  # the four bucket keys are set it logs that no bucket is configured and exits cleanly.
  # restore.sh in the same image restores a dump: open this service's Shell on Render (a fresh
  # instance with this image and these settings) and run /app/restore.sh.
  # The nightly time (02:30 UTC) is in backup.sh's due check, and its heartbeat says
  # dailyAtHourUtc 2: move both together.
  - type: cron
    name: trenchscanner-db-backup
    runtime: docker
    plan: starter
    region: oregon
    schedule: "*/10 * * * *"
    dockerfilePath: ./scripts/db-backup/Dockerfile
    dockerContext: ./scripts/db-backup
    autoDeployTrigger: checksPass
    # The image holds only scripts/db-backup, so no other merge rebuilds it (it rebuilt on every
    # merge, about 29 a day: full audit 2026-10-27, DB-11). This file is listed as the Node
    # services list it.
    buildFilter:
      paths:
        - scripts/db-backup/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # The same bucket and token as the trainer's (model-backup); dumps go under db-dumps/.
      - key: MODEL_BACKUP_S3_ENDPOINT
        sync: false
      - key: MODEL_BACKUP_S3_BUCKET
        sync: false
      - key: MODEL_BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: MODEL_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      # Nightly dumps kept, newest first: two weeks, about 14 x the compressed size in the bucket.
      - key: DB_DUMP_KEEP
        value: "14"

  # The dashboard in apps/web, with the custom domain trenchscanner.app (and www). A page on
  # trenchscanner.app calls the API on api.trenchscanner.app (SAME_SITE_APIS in apps/web/src/api.ts),
  # so its session cookie is first-party. The old trenchscanner-web.onrender.com host keeps calling
  # VITE_API_URL below; onrender.com is a public suffix, so there the cookie is cross-site and
  # browsers that block it fall back to the bearer token (apps/web/src/session.ts).
  - type: web
    runtime: static
    name: trenchscanner-web
    # See the api service's buildCommand comment above: vite and typescript are devDependencies.
    buildCommand: npm ci --include=dev && npm run build -w @trenchscanner/web
    autoDeployTrigger: checksPass
    # A backend-only merge leaves the dashboard as it is (see the api service's buildFilter). The
    # web build reads apps/web, the root manifests, and one core file: @trenchscanner/core/chartMarks
    # (packages/core/src/chartMarks.ts, via the trenchscanner-web export condition). It does not
    # compile packages/core, and its tsconfig extends nothing. The api and the worker still import
    # that subpath from dist, which their own builds compile first.
    buildFilter:
      paths:
        - apps/web/**
        - packages/core/package.json
        - packages/core/src/chartMarks.ts
        - package.json
        - package-lock.json
        - .node-version
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.md"
    staticPublishPath: apps/web/dist
    # The TokenSage page (apps/web/tokensage/index.html, unlisted for now) at /tokensage, with or
    # without the trailing slash.
    routes:
      - type: rewrite
        source: /tokensage
        destination: /tokensage/index.html
      - type: rewrite
        source: /tokensage/
        destination: /tokensage/index.html
    # Clickjacking and sniffing guards for the dashboard. frame-ancestors still lets the HolDEX site
    # frame it, in case its /trenches/ tab ever embeds this page rather than calling the API.
    #
    # The script policy is defence in depth for the session token src/session.ts can keep in
    # localStorage: only this site's own bundles run, plus the inline <script>s of index.html (theme
    # and boot prefetch) and tokensage/index.html (theme), allowed by their sha256. Editing one of
    # those scripts, or VITE_API_URL below (the boot prefetch has it baked in), changes its hash:
    # apps/web/src/csp.test.ts fails until the new hash is pasted here. connect-src is the API on
    # both hosts (SAME_SITE_APIS in apps/web/src/api.ts and VITE_API_URL), plus Privy for email
    # sign-in (its API, its Solana RPC over https and wss, and its funding bridge), from
    # Privy's CSP guide. Privy's window is a frame on auth.privy.io; its captcha is Cloudflare
    # Turnstile (script and frame). DexScreener and GeckoTerminal are the token chart's backup
    # candles, read by the browser when the API has none (apps/web/src/backupCandles.ts). No other
    # site may be framed. Images (token art from any https host, IPFS, data: and blob: share
    # images), styles (React style attributes) and fonts stay unrestricted.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "script-src 'self' https://challenges.cloudflare.com 'sha256-5Z14paLArXMiYwxC/6ty5E5jlf45X+JMHFxkETVMbhE=' 'sha256-KYIyUYVTuGOUtwgz6C9xzns4oKDzv4LdZ6BVTGNVmlU=' 'sha256-2j6Odw+eRssY9Nja5C2BXxiSJJMOhMfs9Fp9tYoEVlU=' 'sha256-eO6WnxT1VOAqTBWNmFSlQhMN2SWrCT/WzqtXBsogR0k='; connect-src 'self' https://api.trenchscanner.app https://trenchscanner-api.onrender.com https://auth.privy.io https://*.rpc.privy.systems wss://*.rpc.privy.systems https://api.relay.link https://api.dexscreener.com https://api.geckoterminal.com; frame-src https://auth.privy.io https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self' https://holdex.live https://www.holdex.live"
      # HTTPS only from the first visit on. No includeSubDomains: only this host's own redirect is
      # certain here, and preload would lock that in for every subdomain.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Built JS, CSS and fonts have content hashes in their names, so a browser can keep them for
      # good and skip revalidating on every visit. index.html keeps Render's default (revalidate),
      # so a deploy still shows up on the next load.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Open tabs poll /version.json to learn a newer dashboard is live (apps/web/src/version.ts),
      # so no copy of it may be kept anywhere. The service worker script is checked by the browser
      # on its own schedule; no-cache keeps that check from ever being answered by a stale copy.
      - path: /version.json
        name: Cache-Control
        value: no-store
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      # The API for every host except trenchscanner.app (see SAME_SITE_APIS in apps/web/src/api.ts).
      - key: VITE_API_URL
        value: https://trenchscanner-api.onrender.com

  # Asyl (user ask 2026-10-24), the wallet-link explorer, on its own subdomain
  # asyl.trenchscanner.app. The same web build as trenchscanner-web (Asyl is apps/web/asyl/index.html
  # and src/asyl), published as its own copy with Asyl's page as the index, so every path on this
  # host opens Asyl (/w/<wallet>, /t/<coin>, /m/<map>, /s/<shared map>: apps/web/src/asyl/route.ts).
  # It calls api.trenchscanner.app (same site, SAME_SITE_APIS), so a session made on
  # trenchscanner.app carries over. Its host is in the api's CORS_ORIGINS and PUBLIC_APP_DOMAIN.
  - type: web
    runtime: static
    name: trenchscanner-asyl
    buildCommand: >-
      npm ci --include=dev && npm run build -w @trenchscanner/web &&
      rm -rf apps/web/dist-asyl && cp -r apps/web/dist apps/web/dist-asyl &&
      cp apps/web/dist/asyl/index.html apps/web/dist-asyl/index.html &&
      rm -rf apps/web/dist-asyl/tokensage apps/web/dist-asyl/sw.js
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/core/package.json
        - packages/core/src/chartMarks.ts
        - package.json
        - package-lock.json
        - .node-version
        - render.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.md"
    staticPublishPath: apps/web/dist-asyl
    domains:
      - asyl.trenchscanner.app
    # Files that exist (the bundles, version.json, icons) are served as they are; every other path
    # is the page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # As the dashboard's, without its inline scripts (Asyl's page has none) or Privy (no email
    # sign-in here: a session made on trenchscanner.app carries over). Nothing may frame it.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "script-src 'self'; connect-src 'self' https://api.trenchscanner.app https://trenchscanner-api.onrender.com; frame-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /version.json
        name: Cache-Control
        value: no-store
    envVars:
      - key: VITE_API_URL
        value: https://trenchscanner-api.onrender.com

databases:
  - name: trenchscanner-db
    # Legacy "starter" no longer accepted for new Postgres instances - Render moved to flexible
    # plans (basic-256mb/1gb/4gb, pro-*, accelerated-*) with storage billed separately. This is
    # the cheapest paid tier, matching what "starter" used to cost (~$7/mo); its default disk
    # size (15GB) is more than this app needs at v1 scale.
    # Raised one tier on 2026-10-04: at 256MB with ~3.9GB of data the database was crashing and
    # restarting repeatedly under the scan's write load.
    # Raised to basic-4gb (2 CPU, 4 GB RAM) on 2026-10-13: at 1 GB with ~4.5 GB of data, heavy
    # background reads went to disk and queued behind each other, and page loads that normally take
    # 0.3-0.6 s took 5-20 s in those bursts (notes/server-load-audit-2026-10-13.md in the project).
    plan: basic-4gb
    # 30 GB since 2026-10-16 (database audit): at the 15 GB default the data was 1.3 GB a day from
    # filling it, and Render suspends a database that outgrows its disk. DB_DISK_ALERT_MB above
    # warns 3 GB under this; raise both together.
    diskSizeGB: 30
    databaseName: trenchscanner
    user: trenchscanner

# TrenchScanner Render Blueprint
#
# Five services, one Postgres database:
#   - trenchscanner-api     Fastify REST API (SIWS auth, filters, matches)
#   - trenchscanner-worker  Background scanner (discovery, scoring, rug screen, alerts, labels)
#   - trenchscanner-trainer Model trainer (contest training, AI judge loop, nightly sweeps)
#   - trenchscanner-web     Static dashboard (apps/web: Live, Model & AI, Filters)
#   - trenchscanner-db      Managed Postgres
#
# The worker and the trainer are the same build with a different WORKER_ROLE (see
# HEARTBEAT_JOB_ROLE in packages/core/src/heartbeat.ts). They were one process until 2026-10-05:
# a training run is minutes of a full CPU on the same single core as the 30-second scan, the
# training set's memory is what capped how much history the models could see, and a crashed
# training run took the scanner down with it. GET /health/worker reports both, each job labelled
# with the process that owns it.
#
# Two dashboards talk to the API: this repo's own apps/web on trenchscanner-web (custom domain
# trenchscanner.app, with the API on api.trenchscanner.app), and the CultScreener/HolDEX site's
# /trenches/ tab (https://github.com/sollama58/CultScreener) on holdex.live. That is why
# CORS_ORIGINS and PUBLIC_APP_DOMAIN below list both, and the old onrender.com hosts too.
#
# After the first deploy, fill in the envVars marked `sync: false` below
# from the Render dashboard (Environment tab on each service):
#   - HELIUS_API_KEY (both api + worker)          https://dev.helius.xyz
#   - ANTHROPIC_API_KEY (worker + trainer)          https://console.anthropic.com
#         Turns on the AI buy/no-buy reviewer (AI_REVIEW_MODE, shadow by default), its daily
#         playbook evolution (AI_PLAYBOOK_EVOLUTION) and Claude's text features for the models
#         (AI_TEXT_FEATURES). Left empty all three are off and alerts flow exactly as before.
#         All three share a hard daily cap, AI_DAILY_BUDGET_USD ($10/day by default); once it is
#         reached the AI stops until midnight UTC (see /health/worker and Admin > AI).
#   - TOKENSAGE_API_URL, TOKENSAGE_API_KEY (worker)  optional: the user's TokenSage service
#         TokenSage says what each scanned coin is about (tokensage/prefetch.ts), stored in
#         TokenNarrative. Off until TOKENSAGE_ENABLED=true is also set; nothing waits on it.
#   - COINGECKO_API_KEY (both api + worker)        optional: a CoinGecko paid-plan key
#         Market data falls back to GeckoTerminal whenever DexScreener answers lookups blank (it
#         did on 2026-10-07). Free, that is 30 calls a minute; with this key it is CoinGecko's
#         on-chain API on the plan's limit (COINGECKO_REQUESTS_PER_MINUTE, 200 by default).
#   - JUPITER_API_KEY (worker)                      optional: a Jupiter API key (free plan is enough)
#         The outcome watcher and the empty-wallet check price on Jupiter's Tokens API first (100
#         mints a call, a per-account limit) and on DexScreener only for what it missed, so
#         DexScreener's per-IP budget goes to the scan's refresh and fast-match.
#   - SOLANA_RPC_URL (both api + worker)           optional: leave empty to use Helius
#         Verifies and reconciles burns. Empty (or a public endpoint) means the Helius RPC built
#         from HELIUS_API_KEY; set it only to use a different paid RPC.
#   - ADMIN_WALLET_ADDRESSES (api only)            your own wallet's base58 address, to reach /admin
#   - TELEGRAM_BOT_TOKEN (api + worker)            optional: a bot token from @BotFather
#         Turns on Telegram alerts (Filters tab -> Telegram alerts): the api runs the bot's webhook
#         and link codes, the worker sends each linked chat its alerts. Empty, the feature is off.
#   - TRADING_KMS_KEY_ID, TRADING_AWS_ACCESS_KEY_ID, TRADING_AWS_SECRET_ACCESS_KEY (api + trader,
#     optional; with TRADING_BOT_ENABLED=true)
#         Custody for the admin-only trading bot's wallets (README -> Trading bot). One KMS key,
#         and a DIFFERENT IAM user per service: the api's may only kms:GenerateDataKey (it creates
#         wallets), the trader's may only kms:Decrypt (it signs). The trader also needs
#         HELIUS_API_KEY (or SOLANA_RPC_URL) and ADMIN_WALLET_ADDRESSES; TRADING_JUPITER_API_KEY
#         is recommended (its own Jupiter key for swaps).
#   - TRADING_SERVER_WALLET_SECRET_KEY (trader only), TRADING_SERVER_WALLET_ADDRESS and
#     TRADING_SERVER_WALLET_WITHDRAW_TO (api + trader), optional
#         A server wallet whose key you supply, traded by a bot every admin controls (Bot tab ->
#         Server wallet). Withdrawals go only to TRADING_SERVER_WALLET_WITHDRAW_TO.
#   - MODEL_BACKUP_S3_ENDPOINT, _BUCKET, _ACCESS_KEY_ID, _SECRET_ACCESS_KEY (trainer only, optional)
#         Off-site copies of the weekly model backups to any S3-compatible bucket (Cloudflare R2,
#         Backblaze B2, AWS S3); MODEL_BACKUP_S3_REGION defaults to "auto" (R2). Unset, backups
#         stay in Postgres only (Admin tab -> Backups) and can still be downloaded from there.
#
# DATABASE_CONNECTION_LIMIT is set (not sync: false - it ships with a value) on both services
# below. Verify the two values plus one LISTEN connection (the API's SSE push, held outside the
# pool - see apps/api/src/matchStream.ts) against the actual connection ceiling on the Postgres
# plan you deploy to (Render dashboard -> the database -> Info tab), and adjust downward if the
# plan is smaller than `basic-256mb`, or if you scale either service to more than one instance -
# every instance opens its own pool.
#
# See PLANNING.md and README.md for the full architecture and local dev setup.

# Only plain, static key/value pairs can live in a shared env var group - Render's Blueprint
# schema doesn't allow a group's envVars to use fromDatabase (references another resource) or
# sync: false (a per-service manual-entry placeholder). DATABASE_URL/HELIUS_API_KEY need one of those, so they're declared directly on
# each service that needs them below instead of here.
envVarGroups:
  - name: trenchscanner-shared
    envVars:
      - key: DEXSCREENER_BASE_URL
        value: https://api.dexscreener.com
      - key: PUMPFUN_BASE_URL
        value: https://frontend-api-v3.pump.fun
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: trenchscanner-api
    runtime: node
    plan: standard
    region: oregon
    # --include=dev: NODE_ENV=production (set below) makes npm omit devDependencies by default,
    # but prisma/typescript/dotenv-cli - all needed just to build - are devDependencies here.
    buildCommand: npm install --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/api
    startCommand: npm run start -w @trenchscanner/api
    # Runs once per deploy, before the new instance takes traffic - applies any pending
    # migrations. Only declared here (not on the worker) so it only ever runs once per deploy.
    preDeployCommand: npm run prisma:deploy
    healthCheckPath: /health
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # Sized explicitly rather than left to Prisma's own `num_physical_cpus * 2 + 1` default,
      # which on a `starter` instance's shared/constrained CPU allocation computed out to 9 for
      # BOTH services regardless of what either actually needed - too tight here, where the Live
      # Feed route alone (apps/api/src/routes/matches.ts) fans out up to four concurrent Prisma
      # calls per request and is polled by every open tab every 45s. 12 covers a real burst of
      # concurrent requests on a single `starter` instance with room to spare.
      #
      # Verify this against the ACTUAL number in Render's Postgres dashboard (Info tab) before
      # raising it: this plus the worker's own limit below, plus the one dedicated LISTEN
      # connection this service holds outside the pool (apps/api/src/matchStream.ts), all draw
      # from the same ceiling.
      - key: DATABASE_CONNECTION_LIMIT
        value: "12"
      - key: HELIUS_API_KEY
        sync: false
      # Optional: a CoinGecko paid-plan key for the market-data fallback (see .env.example).
      - key: COINGECKO_API_KEY
        sync: false
      # Verifies burns for /subscription/claim and mints the blockhash the burn is signed
      # against. Empty (or a public endpoint) uses the Helius RPC built from HELIUS_API_KEY, so it
      # only needs a value to point at a different paid RPC.
      - key: SOLANA_RPC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "168"
      # Every host a dashboard is served from - trenchscanner.app and the CultScreener/HolDEX site
      # each answer on both apex and www, plus trenchscanner-web's own onrender.com host. An origin
      # missing here is silently blocked by the browser.
      - key: CORS_ORIGINS
        value: https://trenchscanner.app,https://www.trenchscanner.app,https://holdex.live,https://www.holdex.live,https://trenchscanner-web.onrender.com
      # Anti-phishing anchor for Sign-In With Solana - the canonical host of each dashboard, no
      # protocol, comma-separated. Each sign-in is bound to the listed host its request came from;
      # anything else gets the first entry, which its wallet refuses to sign. A missing host breaks
      # sign-in on that dashboard outright. See the comment on this var in
      # packages/core/src/config/env.ts.
      #
      # Also decides the session cookie's SameSite: this API compares the host it was reached on
      # against this value per request. While it answers on trenchscanner-api.onrender.com that is
      # cross-site, so the cookie needs SameSite=None - a third-party cookie, which Safari and
      # Brave block outright, so sign-in fails there. The custom domain api.trenchscanner.app on
      # this service fixes it for trenchscanner.app: requests arriving on that host are same-site
      # and get SameSite=Lax automatically. See the comment above sessionCookieAttrs in
      # apps/api/src/routes/auth.ts.
      - key: PUBLIC_APP_DOMAIN
        value: trenchscanner.app,www.trenchscanner.app,holdex.live,trenchscanner-web.onrender.com
      # Comma-separated base58 wallet addresses allowed into the Admin Panel - set this to your
      # own wallet's address after the first deploy. Empty means the Admin Panel 403s everyone.
      - key: ADMIN_WALLET_ADDRESSES
        sync: false
      # Bearer token for GET /stats/hit-rates, the read-only hit-rate report (see README). At
      # least 32 characters; empty leaves the route switched off (404).
      - key: STATS_API_TOKEN
        sync: false
      # Telegram alerts (see packages/core/src/telegram): the bot token from @BotFather. Empty
      # leaves the feature off. Set on this service and the worker below.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Where Telegram delivers the bot's updates: this service's public webhook route.
      - key: TELEGRAM_WEBHOOK_URL
        value: https://trenchscanner-api.onrender.com/telegram/webhook
      # The trading bot (admin-only, packages/core/src/trading). Off until the KMS key and this
      # service's IAM user (kms:GenerateDataKey only) are in place; flip on here and on the trader.
      - key: TRADING_BOT_ENABLED
        value: "false"
      - key: TRADING_KMS_KEY_ID
        sync: false
      - key: TRADING_KMS_REGION
        value: us-east-1
      - key: TRADING_AWS_ACCESS_KEY_ID
        sync: false
      - key: TRADING_AWS_SECRET_ACCESS_KEY
        sync: false
      # The server wallet's PUBLIC address and where its withdrawals go (both public). Its secret
      # key is set on the trader only - never here.
      - key: TRADING_SERVER_WALLET_ADDRESS
        sync: false
      - key: TRADING_SERVER_WALLET_WITHDRAW_TO
        sync: false

  - type: worker
    name: trenchscanner-worker
    runtime: node
    plan: standard
    region: oregon
    # See the api service's buildCommand comment above - same reason.
    buildCommand: npm install --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
    startCommand: npm run start -w @trenchscanner/worker
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # See the api service's DATABASE_CONNECTION_LIMIT above for why this is set explicitly at
      # all. The worker's own number is sized differently: its scan cycle processes up to
      # CANDIDATE_CONCURRENCY (apps/worker/src/jobs/scanJob.ts, 15 at the time of writing) tokens
      # at once, each doing its own DB writes, and a limit below that would have the worker
      # queue against its OWN concurrency rather than anything external - self-inflicted
      # contention on every scan cycle, not just under unusual load. 18 clears that with margin;
      # verify the api+worker total against the Postgres plan's real connection ceiling before
      # raising either.
      - key: DATABASE_CONNECTION_LIMIT
        value: "18"
      # The alert path and label grading only; training and the nightly sweeps run on the
      # trainer service below.
      - key: WORKER_ROLE
        value: scanner
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOKENSAGE_API_URL
        sync: false
      - key: TOKENSAGE_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      # Optional: a CoinGecko paid-plan key for the market-data fallback (see .env.example).
      - key: COINGECKO_API_KEY
        sync: false
      # Optional: a Jupiter API key (portal.jup.ag, free plan). The outcome watcher and the
      # empty-wallet check then price on Jupiter first, leaving DexScreener to the scan.
      - key: JUPITER_API_KEY
        sync: false
      # The burn reconciler's endpoint - see the note on this var on the API above. Empty means
      # Helius via HELIUS_API_KEY.
      - key: SOLANA_RPC_URL
        sync: false
      # Thirty seconds, so a new alert reaches the dashboard within ~half a minute of the token
      # qualifying. Affordable because nothing upstream scales with it: RugCheck requests follow
      # RUGCHECK_CACHE_TTL_MINUTES below (see the worker's rugCheckProfiles.ts), snapshot and
      # liveness writes are spaced in wall-clock time (scanJob.ts), and the wallet budgets below
      # are halved to keep Helius spend per minute what it was at one minute. A full cycle took
      # ~8s on 2026-10-04.
      - key: SCAN_INTERVAL_MINUTES
        value: "0.5"
      # Per-CYCLE Helius budgets. Curated contenders' wallets are looked up first, the rest
      # behind the cycle on what is left. Freshness is half its default (50) because the cycle
      # above runs twice a minute. Holdings was cut from 15 to 10 on 2026-10-04 to save Helius
      # credits: each lookup costs 10 credits and the old budget filled every cycle (~88% of all
      # Helius spend). 10 is the floor - a top-10 holder group is all-or-nothing, so a smaller
      # budget could never complete a contender whose wallets are all uncached.
      - key: WALLET_FRESHNESS_MAX_LOOKUPS_PER_CYCLE
        value: "25"
      - key: WALLET_HOLDINGS_MAX_LOOKUPS_PER_CYCLE
        value: "10"
      - key: RUGCHECK_CACHE_TTL_MINUTES
        value: "5"
      # Wall-clock span holderGrowthPct is measured over, deliberately independent of the scan
      # cadence above so shortening it doesn't silently redefine every user's threshold.
      - key: HOLDER_GROWTH_WINDOW_MINUTES
        value: "30"
      - key: MCAP_FILTER_MIN
        value: "10000"
      - key: MCAP_FILTER_MAX
        value: "1000000"
      - key: WATCHLIST_TTL_HOURS
        value: "24"
      - key: WATCHLIST_MAX_TRACKED
        value: "900"
      - key: CLEANUP_HOUR_UTC
        value: "4"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: STALE_TOKEN_RETENTION_DAYS
        value: "14"
      - key: OUTCOME_TRACKING_HOUR_UTC
        value: "5"
      - key: ACTIVE_VIEW_WINDOW_MINUTES
        value: "10"
      # Live market-cap refresh for tokens someone currently has open - see livePriceJob.ts.
      # Cheap enough for a one-minute cadence: market data only, and no work at all when nobody
      # has the dashboard open.
      - key: LIVE_PRICE_INTERVAL_MINUTES
        value: "1"
      - key: LIVE_PRICE_MAX_TRACKED
        value: "150"
      # The same bot token as on the api: this process sends the alerts (telegram-dispatch).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DASHBOARD_URL
        value: https://trenchscanner.app
      # The same list as on the api: the dispatcher sends real-time alerts only to accounts with
      # access (admin, whitelist or subscription), and this is how it recognises the admin wallets.
      - key: ADMIN_WALLET_ADDRESSES
        sync: false

  # The trading bot (admin-only, packages/core/src/trading): the same worker build, running only
  # the trading-bot job. Its own process for two reasons. Custody: this is the ONLY service holding
  # credentials that can open the bot's wallets (an IAM user allowed nothing but kms:Decrypt on the
  # bot's key), so a bug or a compromised dependency on the scan path can never reach them. And
  # timing: a stop-loss never waits behind a slow scan cycle or a retrain, and a crash elsewhere
  # never leaves open positions unwatched. Exactly one instance: the engine also takes a Postgres
  # advisory lock per pass, but scaling this out buys nothing.
  - type: worker
    name: trenchscanner-trader
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
    startCommand: npm run start -w @trenchscanner/worker
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # One pass at a time, a handful of queries each. Count it with the other services' pools
      # against the Postgres plan's connection ceiling (see the api service above).
      - key: DATABASE_CONNECTION_LIMIT
        value: "4"
      - key: WORKER_ROLE
        value: trader
      # Off until the KMS key and this service's IAM user (kms:Decrypt only) are in place; flip it
      # on here and on the api together (README -> Trading bot).
      - key: TRADING_BOT_ENABLED
        value: "false"
      - key: TRADING_KMS_KEY_ID
        sync: false
      - key: TRADING_KMS_REGION
        value: us-east-1
      - key: TRADING_AWS_ACCESS_KEY_ID
        sync: false
      - key: TRADING_AWS_SECRET_ACCESS_KEY
        sync: false
      # The chain reads and transaction sends: Helius from this key unless SOLANA_RPC_URL names
      # another paid RPC. A trading bot on the public RPC is a stop-loss waiting on a 429.
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      # Jupiter for swaps and prices: its own key so trades never share the scan's 60-a-minute plan.
      - key: TRADING_JUPITER_API_KEY
        sync: false
      # Only these wallets' bots open new positions (exits and withdrawals run for everyone).
      - key: ADMIN_WALLET_ADDRESSES
        sync: false
      # The server wallet (README -> Trading bot -> Server wallet): its private key, as Phantom
      # exports it (base58) or a solana-keygen JSON array. THIS SERVICE ONLY. The address and
      # withdrawal destination below must match the api's.
      - key: TRADING_SERVER_WALLET_SECRET_KEY
        sync: false
      - key: TRADING_SERVER_WALLET_ADDRESS
        sync: false
      - key: TRADING_SERVER_WALLET_WITHDRAW_TO
        sync: false

  # The model trainer: the same worker build, running only the batch jobs (curator-training,
  # champion-refresh, ai-judge, cleanup, outcome-tracking, lighthouse-rollup). Its own instance so
  # that a training run - 5 to 6 minutes of a full core every CURATOR_TRAINING_INTERVAL_HOURS -
  # never competes with the scan for the one CPU, the training set (CURATOR_TRAINING_MAX_ROWS,
  # held twice while the training thread runs) has 2GB to itself, and a run that dies takes
  # nothing on the alert path with it. Needs no Helius or RPC key: everything it reads is already
  # in Postgres, plus DexScreener for the nightly outcome sweep.
  - type: worker
    name: trenchscanner-trainer
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @trenchscanner/core && npm run build -w @trenchscanner/worker
    startCommand: npm run start -w @trenchscanner/worker
    envVars:
      - fromGroup: trenchscanner-shared
      - key: DATABASE_URL
        fromDatabase:
          name: trenchscanner-db
          property: connectionString
      # Training pages its rows in one query at a time and the sweeps run batched statements, so
      # a small pool is plenty. Count it with the api's and the worker's against the Postgres
      # plan's connection ceiling (see the api service above).
      - key: DATABASE_CONNECTION_LIMIT
        value: "6"
      - key: WORKER_ROLE
        value: trainer
      - key: ANTHROPIC_API_KEY
        sync: false
      # The settings the batch jobs read that the scanner also carries, kept identical: the
      # curated band is what training grades decision moments inside, and the retention values
      # are what cleanup enforces.
      - key: MCAP_FILTER_MIN
        value: "10000"
      - key: MCAP_FILTER_MAX
        value: "1000000"
      - key: CLEANUP_HOUR_UTC
        value: "4"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: STALE_TOKEN_RETENTION_DAYS
        value: "14"
      - key: OUTCOME_TRACKING_HOUR_UTC
        value: "5"

  # The dashboard in apps/web, with the custom domain trenchscanner.app (and www). A page on
  # trenchscanner.app calls the API on api.trenchscanner.app (SAME_SITE_APIS in apps/web/src/api.ts),
  # so its session cookie is first-party. The old trenchscanner-web.onrender.com host keeps calling
  # VITE_API_URL below; onrender.com is a public suffix, so there the cookie is cross-site and
  # browsers that block it fall back to the bearer token (apps/web/src/session.ts).
  - type: web
    runtime: static
    name: trenchscanner-web
    buildCommand: npm install --include=dev && npm run build -w @trenchscanner/web
    staticPublishPath: apps/web/dist
    # The TokenSage page (apps/web/tokensage/index.html, unlisted for now) at /tokensage, with or
    # without the trailing slash.
    routes:
      - type: rewrite
        source: /tokensage
        destination: /tokensage/index.html
      - type: rewrite
        source: /tokensage/
        destination: /tokensage/index.html
    # Clickjacking and sniffing guards for the dashboard. frame-ancestors still lets the HolDEX site
    # frame it, in case its /trenches/ tab ever embeds this page rather than calling the API.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://holdex.live https://www.holdex.live"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Built JS, CSS and fonts have content hashes in their names, so a browser can keep them for
      # good and skip revalidating on every visit. index.html keeps Render's default (revalidate),
      # so a deploy still shows up on the next load.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # The API for every host except trenchscanner.app (see SAME_SITE_APIS in apps/web/src/api.ts).
      - key: VITE_API_URL
        value: https://trenchscanner-api.onrender.com

databases:
  - name: trenchscanner-db
    # Legacy "starter" no longer accepted for new Postgres instances - Render moved to flexible
    # plans (basic-256mb/1gb/4gb, pro-*, accelerated-*) with storage billed separately. This is
    # the cheapest paid tier, matching what "starter" used to cost (~$7/mo); its default disk
    # size (15GB) is more than this app needs at v1 scale.
    # Raised one tier on 2026-10-04: at 256MB with ~3.9GB of data the database was crashing and
    # restarting repeatedly under the scan's write load.
    plan: basic-1gb
    databaseName: trenchscanner
    user: trenchscanner

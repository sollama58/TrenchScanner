<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>TrenchScanner</title>
    <meta
      name="description"
      content="Scans new Solana launches, screens out rugs, and raises alerts on the tokens its models rate highest."
    />
    <meta name="theme-color" content="#07080c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrenchScanner" />
    <meta property="og:title" content="TrenchScanner" />
    <meta
      property="og:description"
      content="Scans new Solana launches, screens out rugs, and raises alerts on the tokens its models rate highest."
    />
    <meta property="og:url" content="https://trenchscanner.app/" />
    <!-- Link-preview image. Rename the file (don't overwrite it) when the art changes: X, Telegram,
         Discord and Facebook cache previews by image URL, so a new name makes them fetch it again. -->
    <meta property="og:image" content="https://trenchscanner.app/og-banner.jpg" />
    <meta property="og:image:secure_url" content="https://trenchscanner.app/og-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrenchScanner by ASDFASDFA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrenchScanner" />
    <meta
      name="twitter:description"
      content="Scans new Solana launches, screens out rugs, and raises alerts on the tokens its models rate highest."
    />
    <meta name="twitter:image" content="https://trenchscanner.app/og-banner.jpg" />
    <meta name="twitter:image:alt" content="TrenchScanner by ASDFASDFA" />
    <script>
      // The theme picked in Settings › Feed appearance (src/appearance.ts keeps it under this key),
      // set before the first paint so the page doesn't flash the other theme. Dark until one is
      // picked (DEFAULT_APPEARANCE); "auto" follows the device.
      try {
        var look = JSON.parse(localStorage.getItem("ts.feedAppearance") || "null");
        var theme = look && look.theme;
        if (theme !== "auto")
          document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
      } catch (e) {}
    </script>
    <script>
      // Starts the first screen's API calls while the app bundle is still downloading, instead of
      // after it has run. src/cache.ts adopts these responses (window.__boot) rather than asking
      // again. Keep the per-tab lists in step with what each tab requests on mount.
      (function () {
        var api = "%VITE_API_URL%";
        if (api.charAt(0) === "%") api = "http://localhost:4000";
        api = api.replace(/\/$/, "");
        // Same table as SAME_SITE_APIS in src/api.ts: a page on trenchscanner.app talks to the
        // API on its own subdomain, so the session cookie is first-party.
        var host = location.hostname.toLowerCase();
        if (host === "trenchscanner.app" || /\.trenchscanner\.app$/.test(host))
          api = "https://api.trenchscanner.app";
        var h = location.hash.replace("#", "");
        // Opened from a desktop's pairing QR (src/deviceLink.ts): this phone has no session yet,
        // so every call would come back 401. The app redeems the code first.
        if (h.indexOf("link=") === 0) return;
        // The Lighthouse tab's Right now, as src/routes.ts lighthousePath builds it.
        var lighthouse = function (base) {
          var tz = "";
          try {
            tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
          } catch (e) {}
          return base + "/lighthouse?days=7" + (tz ? "&tz=" + encodeURIComponent(tz) : "");
        };
        // /announcement is the broadcast bar above every tab (src/components/AnnouncementBar.tsx):
        // early, it is up before the feed paints rather than pushing the feed down after.
        var paths = ["/auth/me", "/subscription", "/health/worker", "/settings", "/announcement"].concat(
          h === "model"
            ? ["/curated/insights?days=7", "/curated/models?days=7"]
            : h === "stream"
              ? // The Stream (src/components/StreamView.tsx), as src/routes.ts STREAM_DATA.
                ["/launches"]
              : h === "filters" || h === "top"
                ? ["/filters", "/config", "/filters/leaderboard", "/curated/models?days=30", "/telegram"]
                : h === "settings"
                  ? []
                  : h === "utilities"
                    ? ["/utilities"]
                    : h === "admin"
                      ? []
                      : h === "lighthouse"
                        ? [
                            "/curated/lighthouse/history?days=30&bucket=day&dimension=category",
                            lighthouse("/curated"),
                            "/curated/models?days=30",
                          ]
                        : [
                            "/matches?page=1&includeCurated=saved",
                            "/matches/stats?hours=24",
                            "/curated/stats",
                            "/curated/models?days=30",
                          ],
        );
        var boot = (window.__boot = {});
        if (!window.fetch) return;
        // The session token src/session.ts keeps for browsers that drop the third-party cookie.
        var headers = {};
        try {
          var token = localStorage.getItem("ts-session-token");
          if (token) headers.authorization = "Bearer " + token;
          // A guest (src/session.ts, isGuest) has no session: only the public guest feed is worth
          // starting, and the session calls would only come back 401.
          if (localStorage.getItem("ts-guest") === "1")
            paths = ["/health/worker", "/announcement"].concat(
              h === "model"
                ? ["/guest/insights?days=7", "/guest/models?days=7"]
                : h === "lighthouse"
                  ? [
                      "/guest/lighthouse/history?days=30&bucket=day&dimension=category",
                      lighthouse("/guest"),
                      "/guest/models?days=30",
                    ]
                  : ["/guest/feed?page=1"],
            );
        } catch (e) {}
        paths.forEach(function (p) {
          boot[p] = fetch(api + p, { credentials: "include", headers: headers });
          boot[p].catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown while the app's code downloads; React replaces it on its first render. Same look
           as the loader in src/components/PageLoader.tsx. -->
      <style>
        .pre-boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: #07080c;
          font:
            600 14px system-ui,
            -apple-system,
            "Segoe UI",
            sans-serif;
          color: #f3f5fa;
        }
        .pre-boot div {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }
        .pre-boot img {
          width: 48px;
          height: 48px;
          animation: pre-boot-breathe 1.8s ease-in-out infinite;
        }
        .pre-boot i {
          display: block;
          width: 180px;
          height: 6px;
          border-radius: 999px;
          background: #1f2330;
          overflow: hidden;
        }
        .pre-boot i::after {
          content: "";
          display: block;
          width: 40%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, #8b5cf6, #3b82f6);
          animation: pre-boot-slide 1.2s ease-in-out infinite;
        }
        @keyframes pre-boot-breathe {
          50% {
            opacity: 0.5;
            transform: scale(0.95);
          }
        }
        @keyframes pre-boot-slide {
          from {
            transform: translateX(-100%);
          }
          to {
            transform: translateX(250%);
          }
        }
        @media (prefers-color-scheme: light) {
          :root:not([data-theme="dark"]) .pre-boot {
            background: #f4f5f9;
            color: #0c0e14;
          }
          :root:not([data-theme="dark"]) .pre-boot i {
            background: #eceef4;
          }
        }
        :root[data-theme="light"] .pre-boot {
          background: #f4f5f9;
          color: #0c0e14;
        }
        :root[data-theme="light"] .pre-boot i {
          background: #eceef4;
        }
        @media (prefers-reduced-motion: reduce) {
          .pre-boot img,
          .pre-boot i::after {
            animation: none;
          }
        }
      </style>
      <div class="pre-boot" role="progressbar" aria-label="Loading TrenchScanner">
        <div>
          <img src="/favicon.svg" alt="" />
          <span>Loading TrenchScanner</span>
          <i></i>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

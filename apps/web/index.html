<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>TrenchScanner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%238b5cf6' stroke-width='4'/><circle cx='16' cy='16' r='4' fill='%238b5cf6'/></svg>"
    />
    <script>
      // Starts the first screen's API calls while the app bundle is still downloading, instead of
      // after it has run. src/cache.ts adopts these responses (window.__boot) rather than asking
      // again. Keep the per-tab lists in step with what each tab requests on mount.
      (function () {
        var api = "%VITE_API_URL%";
        if (api.charAt(0) === "%") api = "http://localhost:4000";
        api = api.replace(/\/$/, "");
        var h = location.hash.replace("#", "");
        var paths = ["/auth/me", "/subscription", "/health/worker", "/settings"].concat(
          h === "model"
            ? ["/curated/insights?days=30", "/curated/models?days=30"]
            : h === "filters"
              ? ["/filters", "/config"]
              : h === "settings"
                ? ["/curated/models?days=30"]
                : h === "admin"
                  ? []
                  : ["/matches?page=1&includeCurated=saved", "/curated/stats", "/curated/models?days=30"],
        );
        var boot = (window.__boot = {});
        if (!window.fetch) return;
        // The session token src/session.ts keeps for browsers that drop the third-party cookie.
        var headers = {};
        try {
          var token = localStorage.getItem("ts-session-token");
          if (token) headers.authorization = "Bearer " + token;
        } catch (e) {}
        paths.forEach(function (p) {
          boot[p] = fetch(api + p, { credentials: "include", headers: headers });
          boot[p].catch(function () {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

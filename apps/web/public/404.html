<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found · TrenchScanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- For a path the host doesn't serve. No scripts (the site's CSP allows only hashed inline
         ones) and no bundle assets, so it stands alone; the same layout as the app's crash screen
         (src/components/ThisIsFine.tsx, .fine in src/styles.css). -->
    <style>
      html,
      body {
        margin: 0;
        background: #1a1208;
        color: #fff;
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 42% 50%;
      }
      .copy {
        position: relative;
        width: 100%;
        padding: 96px max(20px, env(safe-area-inset-left)) max(28px, env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.6) 40%, rgba(0, 0, 0, 0.85));
        text-align: center;
      }
      h1 {
        font-size: clamp(22px, 4vw, 34px);
        margin: 0 0 8px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      p {
        max-width: 560px;
        margin: 0 auto;
        color: rgba(255, 255, 255, 0.82);
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 9px 16px;
        border-radius: 10px;
        background: #963a18;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.1);
      }
      @media (prefers-reduced-motion: reduce) {
        video {
          display: none;
        }
        main {
          background: #1a1208 url(/this-is-fine.jpg) 42% 50% / cover no-repeat;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <video
        poster="/this-is-fine.jpg"
        autoplay
        loop
        muted
        playsinline
        disablepictureinpicture
        aria-hidden="true"
      >
        <source src="/this-is-fine.mp4" type="video/mp4" />
        <source src="/this-is-fine.webm" type="video/webm" />
      </video>
      <div class="copy">
        <h1>This page doesn't exist</h1>
        <p>The link may be old or mistyped. Everything else is fine.</p>
        <a href="/">Back to TrenchScanner</a>
      </div>
    </main>
  </body>
</html>
